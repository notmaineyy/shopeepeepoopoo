<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#EE4D2D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Shopee Link Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            shopee: {
              DEFAULT: '#EE4D2D',
              dark: '#c9381a',
              light: '#ff6a3d'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen">

  <header class="bg-gradient-to-br from-shopee via-[#f15b3a] to-[#ff8a5c] text-white">
    <div class="max-w-2xl mx-auto px-4 pt-10 pb-20 text-center relative">

      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Shopee Link Converter</h1>
      <p class="mt-3 text-white/90 max-w-md mx-auto text-sm sm:text-base">
        you can convert your shopee links here, and we can split the commission that i get hehe, just text me once you've bought your items!
      </p>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 -mt-12 pb-44">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-5 sm:p-6">
      <label for="links" class="block text-sm font-semibold text-gray-700 mb-2">
        Paste your Shopee links <span class="font-normal text-gray-400">(one per line)</span>
      </label>
      <textarea id="links" rows="6" spellcheck="false"
        placeholder="https://shopee.sg/Product-Name-i.123456789.9876543210&#10;https://shopee.sg/product/123456789/9876543210&#10;https://shopee.sg/shop/71756544"
        class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-shopee/50 focus:border-shopee transition"></textarea>
      <button id="convert"
        class="mt-4 w-full bg-shopee hover:bg-shopee-dark active:scale-[.98] transition text-white font-bold rounded-xl py-3.5 shadow-lg shadow-shopee/30">
        Convert links
      </button>
    </div>

    <div id="results" class="mt-6 space-y-3"></div>
  </main>

  <div id="stickyBar" class="hidden fixed bottom-0 inset-x-0 z-40 bg-white/90 backdrop-blur border-t border-gray-200 shadow-[0_-4px_20px_rgba(0,0,0,0.06)]" style="padding-bottom: env(safe-area-inset-bottom);">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="text-sm text-gray-600">
        <span id="count" class="font-bold text-shopee">0</span> links ready
      </div>
      <button id="copyAll"
        class="inline-flex items-center gap-2 bg-shopee hover:bg-shopee-dark transition text-white text-sm font-semibold rounded-xl px-5 py-2.5 shadow-md">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
        Copy all
      </button>
    </div>
  </div>

  <div id="toastContainer" class="fixed top-4 inset-x-0 z-50 flex flex-col items-center gap-2 pointer-events-none"></div>

  <script src="app.js"></script>
</body>
</html>
